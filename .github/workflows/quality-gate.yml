name: Insurance API quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Run API release gate
        id: tests
        run: pnpm test
      - name: Generate Allure report
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        run: pnpm allure:generate
      - name: Upload reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insurance-api-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
            allure-results/
            allure-report/
          retention-days: 14
